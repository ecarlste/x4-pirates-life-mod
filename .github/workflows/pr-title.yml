name: PR title

# PRs are squash-merged with the PR title as the commit title, so the title must follow
# Conventional Commits (type(optional-scope)!: summary). The squash commit on main gets
# " (#123)" appended, and GitHub cuts commit titles off at about 72 characters, so PR titles
# are capped at 65: the commit list on main stays readable without hovering.
on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read

jobs:
  conventional:
    name: Conventional Commits title
    runs-on: ubuntu-latest
    steps:
      - name: Check the PR title
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          pattern='^(feat|fix|docs|test|ci|build|refactor|perf|style|chore|revert)(\([a-z0-9._/-]+\))?!?: [^ ].*'
          if ! [[ "$TITLE" =~ $pattern ]]; then
            echo "::error::PR title must follow Conventional Commits, e.g. 'feat(md): add smoke test script'. Got: $TITLE"
            exit 1
          fi
          if [ "${#TITLE}" -gt 65 ]; then
            echo "::error::PR title is ${#TITLE} characters; keep it to 65 so the squash commit on main (title plus \" (#123)\") isn't cut off by GitHub. Put details in the description."
            exit 1
          fi
          echo "OK (${#TITLE} characters): $TITLE"
