name: PR title

# PRs are squash-merged with the PR title as the commit title, so the title must follow
# Conventional Commits (type(optional-scope)!: summary). Titles are capped at 72 characters,
# about where GitHub cuts commit titles off, so the commit list on main reads without hovering.
# The " (#123)" GitHub appends when squashing may get cut off; nobody needs it while scanning.
on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read

jobs:
  conventional:
    name: Conventional Commits title
    runs-on: ubuntu-latest
    steps:
      - name: Check the PR title
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          pattern='^(feat|fix|docs|test|ci|build|refactor|perf|style|chore|revert)(\([a-z0-9._/-]+\))?!?: [^ ].*'
          if ! [[ "$TITLE" =~ $pattern ]]; then
            echo "::error::PR title must follow Conventional Commits, e.g. 'feat(md): add smoke test script'. Got: $TITLE"
            exit 1
          fi
          if [ "${#TITLE}" -gt 72 ]; then
            echo "::error::PR title is ${#TITLE} characters; keep it to 72 so GitHub doesn't cut it off. Put details in the description."
            exit 1
          fi
          echo "OK (${#TITLE} characters): $TITLE"
