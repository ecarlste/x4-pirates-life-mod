name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Picks the suites a PR needs: dorny/paths-filter matches the changed files against
  # .github/test-filters.json (make test reads the same file). Pushes to main and manual runs
  # test everything. A job with nothing to run shows as skipped.
  changes:
    name: pick tests
    runs-on: ubuntu-latest
    outputs:
      suites: ${{ steps.pick.outputs.suites }}
      bash: ${{ steps.pick.outputs.bash }}
      shellcheck: ${{ steps.pick.outputs.shellcheck }}
      lua: ${{ steps.pick.outputs.lua }}
      typescript: ${{ steps.pick.outputs.typescript }}
      doc-paths: ${{ steps.pick.outputs.doc-paths }}
      doc-names: ${{ steps.pick.outputs.doc-names }}
      pester: ${{ steps.pick.outputs.pester }}
    steps:
      - uses: actions/checkout@v7
      # Every file in the repo must match a filter, so a new kind of file can't go untested
      - run: python3 tools/select_tests.py --check
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        if: github.event_name == 'pull_request'
        with:
          filters: .github/test-filters.json
      - id: pick
        env:
          KEYS: ${{ github.event_name == 'pull_request' && steps.filter.outputs.changes || '["everything"]' }}
        run: python3 tools/select_tests.py --keys "$KEYS" --github >> "$GITHUB_OUTPUT"

  lint:
    name: shellcheck
    needs: changes
    if: needs.changes.outputs.shellcheck == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: shellcheck deploy.sh tests/run.sh tests/lua/run.sh tools/game-lock.sh tools/deploy-config.sh tools/post-game-test-report.sh tools/release.sh .githooks/pre-commit
      - run: shellcheck -s bash tests/*.bash tests/*.bats

  # The bash tooling (deploy.sh, tests/run.sh, the tools) runs in WSL (Ubuntu), so Linux only
  bash:
    name: bats
    needs: changes
    if: needs.changes.outputs.bash == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # bats is fetched into .tools/ on first run; keep it between runs
      - uses: actions/cache@v6
        with:
          path: .tools
          key: tools-${{ runner.os }}-${{ hashFiles('tests/run.sh', 'tests/run.ps1') }}
      - run: bash --version | head -n 1
      - run: tests/run.sh --suites "$SUITES" --bash-only
        env:
          SUITES: ${{ needs.changes.outputs.suites }}

  lua:
    name: Lua (luacheck, unit tests)
    needs: changes
    if: needs.changes.outputs.lua == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # luacheck and LuaUnit are fetched into .tools/ on first run; keep them between runs
      - uses: actions/cache@v6
        with:
          path: .tools
          key: lua-tools-${{ runner.os }}-${{ hashFiles('tests/lua/run.sh') }}
      # LuaJIT, the Lua that X4 runs
      - run: sudo apt-get update -q && sudo apt-get install -y -q luajit
      - run: tests/run.sh --lua-only

  # The TypeScript tools: the diff-patch check skips here (no unpacked game files), its unit tests run;
  # also the lowercase-paths check on the shipped files
  typescript:
    name: TypeScript (tsc, unit tests)
    needs: changes
    if: needs.changes.outputs.typescript == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # The tools run .ts directly, which needs Node's type stripping
      - uses: actions/setup-node@v7
        with:
          node-version: "26"
          cache: npm
      - run: npm ci --no-fund --no-audit
      - run: tests/run.sh --typescript-only

  # The docs name only repo paths that exist (tools/check-doc-paths.ts; Node only, no packages)
  doc-paths:
    name: Doc paths
    needs: changes
    if: needs.changes.outputs.doc-paths == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # The check runs .ts directly, which needs Node's type stripping
      - uses: actions/setup-node@v7
        with:
          node-version: "26"
      - run: node tools/check-doc-paths.ts

  # The docs and tools name no removed mod global or game test (tools/check-doc-names.ts; Node
  # only, no packages). It reads the removed tests from git history, so it needs all of it.
  doc-names:
    name: Doc names
    needs: changes
    if: needs.changes.outputs.doc-names == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # The check runs .ts directly, which needs Node's type stripping
      - uses: actions/setup-node@v7
        with:
          node-version: "26"
      - run: node tools/check-doc-names.ts

  # The PowerShell scripts (deploy.ps1, tools/run-game-tests.ps1, tools/unpack-x4.ps1) run on
  # Windows: test both PowerShells a Windows user may have. (make test runs Pester under
  # PowerShell 7 in WSL too, for speed; that path is checked by every local run.)
  pester:
    name: Pester (${{ matrix.name }})
    needs: changes
    if: needs.changes.outputs.pester != ''
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: Windows PowerShell 5.1, shell: powershell }
          - { name: PowerShell 7, shell: pwsh }
    runs-on: windows-latest
    defaults:
      run:
        shell: ${{ matrix.shell }}
    steps:
      - uses: actions/checkout@v7
      # bats and Pester are fetched into .tools/ on first run; keep them between runs
      - uses: actions/cache@v6
        with:
          path: .tools
          key: tools-${{ runner.os }}-${{ hashFiles('tests/run.sh', 'tests/run.ps1') }}
      - run: ./tests/run.ps1 -CI -Path $env:PESTER
        env:
          PESTER: ${{ needs.changes.outputs.pester }}
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: pester-results-${{ matrix.shell }}
          path: tests/results.xml
